<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hit&Blow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="shortcut icon" href="/game-sites/index/icon/icon1.png" >
<style>
body{
  margin:0;
  background:#0b0f1a;
  color:#fff;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  user-select:none;
}
.app{
  width:360px;
  background:#111;
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 30px #00ffff55;
}
h1{
  text-align:center;
  margin:5px 0 10px;
}
.secret, .guess{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}
.slot{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#333;
  border:2px solid #555;
}
.palette{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0;
}
.color{
  width:60px;
  height:60px;
  border-radius:50%;
  cursor:pointer;
  border:3px solid transparent;
}
.color:active{
  transform:scale(0.9);
}
.red{background:#f00;}
.blue{background:#00f;}
.green{background:#0f0;}
.yellow{background:#ff0;}
.purple{background:#a0f;}
.cyan{background:#0ff;}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#0ff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.log{
  margin-top:10px;
  max-height:200px;
  overflow:auto;
  font-size:14px;
}
.entry{
  margin-bottom:5px;
}

/* フローティングボタンの共通デザイン */
.floating-btn{
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #111;
  border: 2px solid #4da6ff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  color: #bcdfff;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 0 10px #3d8cff88;
  font-family:'Segoe UI',sans-serif;
}
/* ホバー時に光る */
.floating-btn:hover{
  background: #4da6ff33;
  box-shadow: 0 0 16px #4da6ffcc;
}
/* クリック時に縮む */
.floating-btn:active{
  transform: scale(0.9);
}
/* ボタン位置調整 */
#reloadBtn{
  bottom: 90px; /* logout の上に配置 */
}
#logoutBtn{
  bottom: 20px;
}
</style>
</head>
<body>
<div class="app">
  <h1>🎨 Hit&Blow</h1>
  <div class="guess" id="guess">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>
  <div class="palette">
    <div class="color red" data-color="red"></div>
    <div class="color blue" data-color="blue"></div>
    <div class="color green" data-color="green"></div>
    <div class="color yellow" data-color="yellow"></div>
    <div class="color purple" data-color="purple"></div>
    <div class="color cyan" data-color="cyan"></div>
  </div>
  <button id="check">判定</button>
  <div class="log" id="log"></div>
</div>
<div id="reloadBtn" class="floating-btn" onclick="reload()">↻</div>
<div id="logoutBtn" class="floating-btn" onclick="backPage()">⇦</div>
<script>
const colors = ["red","blue","green","yellow","purple","cyan"];
let secret = [];
let guess = [null,null,null,null];
let cursor = 0; // 今選択中のスロット
let history = [];

// 秘密の色を作る（重複なし）
function generate(){
  secret = [];
  while(secret.length < 4){
    const c = colors[Math.floor(Math.random()*6)];
    if(!secret.includes(c)) secret.push(c);
  }
  //console.log("答え", secret);
}
generate();

const slots = document.querySelectorAll(".slot");
document.querySelectorAll(".color").forEach(btn=>{
  btn.onclick = ()=>{
  const c = btn.dataset.color;
  guess[cursor] = c;
  slots[cursor].style.background = getColor(c);
  // 次のスロットへ
  if(cursor < 3) cursor++;
    highlightCursor();
  };
});

function highlightCursor(){
  slots.forEach((s,i)=>{
    s.style.outline = (i===cursor) ? "3px solid #0ff" : "none";
  });
}
highlightCursor();

function getColor(c){
  return {
    red:"#f00",blue:"#00f",green:"#0f0",
    yellow:"#ff0",purple:"#a0f",cyan:"#0ff"
  }[c];
}

slots.forEach((slot,i)=>{
  slot.onclick = ()=>{
    cursor = i;
    highlightCursor();
  };
});

document.getElementById("check").onclick = ()=>{
  if(guess.includes(null)) return alert("4色選んでください");

let hit = 0;
let blow = 0;
let secretLeft = [];
let guessLeft = [];

// ① Hitを処理
for(let i=0;i<4;i++){
  if(guess[i] === secret[i]){
    hit++;
  }else{
    secretLeft.push(secret[i]);
    guessLeft.push(guess[i]);
  }
}
// ② Blowを処理（重複対策）
guessLeft.forEach(c=>{
  const idx = secretLeft.indexOf(c);
  if(idx !== -1){
    blow++;
    secretLeft.splice(idx,1); // 使った色を消す
  }
});

history.unshift({
  guess: [...guess],
  hit: hit,
  blow: blow
});
renderLog();

  if(hit===4){
    alert("🎉 正解！！");
    //location.reload();
  }

  // リセット
  guess = [null,null,null,null];
  cursor = 0;
  slots.forEach(s=>s.style.background="#333");
  highlightCursor();
};

function renderLog(){
  const log = document.getElementById("log");
  log.innerHTML = "";

  history.forEach(entry=>{
    const row = document.createElement("div");
    row.className = "entry";
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "10px";

    // 色の並び
    const colors = document.createElement("div");
    colors.style.display = "flex";
    colors.style.gap = "6px";

    entry.guess.forEach(c=>{
      const dot = document.createElement("div");
      dot.style.width = "20px";
      dot.style.height = "20px";
      dot.style.borderRadius = "50%";
      dot.style.background = getColor(c);
      colors.appendChild(dot);
    });

    // Hit / Blow
    const text = document.createElement("div");
    text.textContent = `${entry.hit} Hit / ${entry.blow} Blow`;

    row.appendChild(colors);
    row.appendChild(text);
    log.appendChild(row);
  });
}
</script>

        const token1 = urlParams.get("key1");
        const token3 = localStorage.getItem("account1");
        localStorage.setItem("account1", "");
        if((token1 !== localStorage.getItem("key1")) || (token3 == "") || (token3 == null)){
            localStorage.setItem("key1", "unauthorized");
            localStorage.setItem("requestPage1", "game/page0013/page0013");
            location.href = "/game-sites/";
        }else{
            localStorage.setItem("requestPage1", "");
            localStorage.setItem("key1", "");
            setInterval(() => {
                sendToGAS(token3, "", "page");
            }, 5000);
        }

    /* ======== Google Apps Script Web App URL ======== */
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbxzPIpMXRgQ5QuKM_hwIQ815at4Ml6Vvqhx_zabeDNGupPwsTvWWP3jpOXLnxbeGSIMDQ/exec";
    /* ======== GASに送信する処理 ======== */
    async function sendToGAS(User, text, status){
      const payload = {
        user: User,
        message: text,
        status
      };
      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",   // ← GAS が CORS 許可してないため必要
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("送信エラー:", e);
      }
    }
        function reload(){
            const key1 = crypto.randomUUID();
            localStorage.setItem("key1", key1);
            localStorage.setItem("account1", token3);
            location.href = "/game-sites/game/page0013/page0013?key1=" + key1;
        }
        function backPage(){
            const key1 = crypto.randomUUID();
            localStorage.setItem("key1", key1);
            localStorage.setItem("account1", token3);
            location.href = "/game-sites/tool/top-tool0001?key1=" + key1;
        }
    </script>
</body>
</html>
