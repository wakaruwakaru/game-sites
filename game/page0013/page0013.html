<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Hit&Blow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
  margin:0;
  background:#0b0f1a;
  color:#fff;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  user-select:none;
}
.app{
  width:360px;
  background:#111;
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 30px #00ffff55;
}
h1{
  text-align:center;
  margin:5px 0 10px;
}
.secret, .guess{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}
.slot{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#333;
  border:2px solid #555;
}
.palette{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:15px 0;
}
.color{
  width:60px;
  height:60px;
  border-radius:50%;
  cursor:pointer;
  border:3px solid transparent;
}
.color:active{
  transform:scale(0.9);
}
.red{background:#f00;}
.blue{background:#00f;}
.green{background:#0f0;}
.yellow{background:#ff0;}
.purple{background:#a0f;}
.cyan{background:#0ff;}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#0ff;
  color:#000;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.log{
  margin-top:10px;
  max-height:200px;
  overflow:auto;
  font-size:14px;
}
.entry{
  margin-bottom:5px;
}
</style>
</head>
<body>
<div class="app">
<h1>🎨 Hit&Blow</h1>

<div class="guess" id="guess">
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
  <div class="slot"></div>
</div>

<div class="palette">
  <div class="color red" data-color="red"></div>
  <div class="color blue" data-color="blue"></div>
  <div class="color green" data-color="green"></div>
  <div class="color yellow" data-color="yellow"></div>
  <div class="color purple" data-color="purple"></div>
  <div class="color cyan" data-color="cyan"></div>
</div>

<button id="check">判定</button>

<div class="log" id="log"></div>
</div>

<script>
const colors = ["red","blue","green","yellow","purple","cyan"];
let secret = [];
let guess = [null,null,null,null];
let cursor = 0; // 今選択中のスロット
let history = [];

// 秘密の色を作る（重複なし）
function generate(){
  secret = [];
  while(secret.length < 4){
    const c = colors[Math.floor(Math.random()*6)];
    if(!secret.includes(c)) secret.push(c);
  }
  console.log("答え", secret);
}
generate();

const slots = document.querySelectorAll(".slot");
document.querySelectorAll(".color").forEach(btn=>{
  btn.onclick = ()=>{
  const c = btn.dataset.color;
  guess[cursor] = c;
  slots[cursor].style.background = getColor(c);
  // 次のスロットへ
  if(cursor < 3) cursor++;
    highlightCursor();
  };
});

function highlightCursor(){
  slots.forEach((s,i)=>{
    s.style.outline = (i===cursor) ? "3px solid #0ff" : "none";
  });
}
highlightCursor();

function getColor(c){
  return {
    red:"#f00",blue:"#00f",green:"#0f0",
    yellow:"#ff0",purple:"#a0f",cyan:"#0ff"
  }[c];
}

document.getElementById("check").onclick = ()=>{
  if(guess.includes(null)) return alert("4色選んでください");

slots.forEach((slot,i)=>{
  slot.onclick = ()=>{
    cursor = i;
    highlightCursor();
  };
});

let hit = 0;
let blow = 0;
let secretLeft = [];
let guessLeft = [];

// ① Hitを処理
for(let i=0;i<4;i++){
  if(guess[i] === secret[i]){
    hit++;
  }else{
    secretLeft.push(secret[i]);
    guessLeft.push(guess[i]);
  }
}
// ② Blowを処理（重複対策）
guessLeft.forEach(c=>{
  const idx = secretLeft.indexOf(c);
  if(idx !== -1){
    blow++;
    secretLeft.splice(idx,1); // 使った色を消す
  }
});

history.unshift({
  guess: [...guess],
  hit: hit,
  blow: blow
});
renderLog();

  if(hit===4){
    alert("🎉 正解！！");
    location.reload();
  }

  // リセット
  guess = [null,null,null,null];
  cursor = 0;
  slots.forEach(s=>s.style.background="#333");
  highlightCursor();
};

function renderLog(){
  const log = document.getElementById("log");
  log.innerHTML = "";

  history.forEach(entry=>{
    const row = document.createElement("div");
    row.className = "entry";
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "10px";

    // 色の並び
    const colors = document.createElement("div");
    colors.style.display = "flex";
    colors.style.gap = "6px";

    entry.guess.forEach(c=>{
      const dot = document.createElement("div");
      dot.style.width = "20px";
      dot.style.height = "20px";
      dot.style.borderRadius = "50%";
      dot.style.background = getColor(c);
      colors.appendChild(dot);
    });

    // Hit / Blow
    const text = document.createElement("div");
    text.textContent = `${entry.hit} Hit / ${entry.blow} Blow`;

    row.appendChild(colors);
    row.appendChild(text);
    log.appendChild(row);
  });
}
</script>
</body>
</html>
