<html>
<head>
<meta charset="UTF-8">
<title>Color Picker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:#0b0f1a;
  color:white;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.panel{
  background:#111;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 30px #00ffff55;
  width:320px;
}
h1{
  margin:0 0 10px;
  text-align:center;
}
.preview{
  width:100%;
  height:80px;
  border-radius:10px;
  border:2px solid #00ffff;
  margin-bottom:10px;
}
input{
  width:100%;
  padding:8px;
  border:none;
  border-radius:6px;
  margin-bottom:8px;
  font-size:16px;
  background:#222;
  color:white;
}
input[type=color]{
  height:50px;
  padding:0;
}
label{
  font-size:13px;
  color:#88ffff;
}
</style>
</head>
<body>

<div class="panel">
<h1>🎨 Color Picker</h1>

<div class="preview" id="preview"></div>

<label>HEX</label>
<input id="hex" value="#00ffff">

<label>RGB</label>
<input id="rgb" value="0,255,255">

<label>HSL</label>
<input id="hsl" value="180,100,50">

<label>Pick</label>
<input type="color" id="picker" value="#00ffff">
</div>

<script>
const hexInput = document.getElementById("hex");
const rgbInput = document.getElementById("rgb");
const hslInput = document.getElementById("hsl");
const picker = document.getElementById("picker");
const preview = document.getElementById("preview");

function updatePreview(color){
  preview.style.background = color;
  picker.value = color;
}

// HEX → RGB
function hexToRgb(hex){
  hex = hex.replace("#","");
  const num = parseInt(hex,16);
  return {
    r:(num>>16)&255,
    g:(num>>8)&255,
    b:num&255
  };
}

// RGB → HEX
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

// RGB → HSL
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;

  if(max===min){
    h=s=0;
  }else{
    const d = max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      case b: h=(r-g)/d+4; break;
    }
    h*=60;
  }
  return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)};
}

// HSL → RGB
function hslToRgb(h,s,l){
  s/=100; l/=100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r=0,g=0,b=0;

  if(h<60){r=c;g=x;}
  else if(h<120){r=x;g=c;}
  else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}
  else if(h<300){r=x;b=c;}
  else{r=c;b=x;}

  return {
    r:Math.round((r+m)*255),
    g:Math.round((g+m)*255),
    b:Math.round((b+m)*255)
  };
}

// HEX入力
hexInput.oninput = ()=>{
  const rgb = hexToRgb(hexInput.value);
  rgbInput.value = `${rgb.r},${rgb.g},${rgb.b}`;
  const hsl = rgbToHsl(rgb.r,rgb.g,rgb.b);
  hslInput.value = `${hsl.h},${hsl.s},${hsl.l}`;
  updatePreview(hexInput.value);
};

// RGB入力
rgbInput.oninput = ()=>{
  const [r,g,b] = rgbInput.value.split(",").map(Number);
  const hex = rgbToHex(r,g,b);
  const hsl = rgbToHsl(r,g,b);
  hexInput.value = hex;
  hslInput.value = `${hsl.h},${hsl.s},${hsl.l}`;
  updatePreview(hex);
};

// HSL入力
hslInput.oninput = ()=>{
  const [h,s,l] = hslInput.value.split(",").map(Number);
  const rgb = hslToRgb(h,s,l);
  const hex = rgbToHex(rgb.r,rgb.g,rgb.b);
  hexInput.value = hex;
  rgbInput.value = `${rgb.r},${rgb.g},${rgb.b}`;
  updatePreview(hex);
};

// Picker
picker.oninput = ()=>{
  hexInput.value = picker.value;
  hexInput.oninput();
};

hexInput.oninput();
</script>

</body>
</html>
