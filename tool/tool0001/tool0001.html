<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/game-sites/index/icon/icon1.png" >
    <title>π generator</title>
    <style>
body{
  font-family: monospace;
  background:black;
  user-select:none;
}
.out{
  color:#0f0;
  font-size:30px;
}
.log{
  font-size: 20px;
  z-index: 9999;
  color: #4da6ff;
}
.log1{
  position: fixed;
  right: 20px;
  top: 20px;
}
.log2{
  position: fixed;
  right: 20px;
  top: 50px;
}
.log3{
  position: fixed;
  right: 20px;
  top: 80px;
}

.log255{
  position: fixed;
  right: 20px;
  bottom: 160px;
  cursor: pointer;
}

/* フローティングボタンの共通デザイン */
.floating-btn{
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: #111;
  border: 2px solid #4da6ff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 26px;
  color: #bcdfff;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 0 10px #3d8cff88;
}
/* ホバー時に光る */
.floating-btn:hover{
  background: #4da6ff33;
  box-shadow: 0 0 16px #4da6ffcc;
}
/* クリック時に縮む */
.floating-btn:active{
  transform: scale(0.9);
}
/* ボタン位置調整 */
#reloadBtn{
  bottom: 90px; /* logout の上に配置 */
}

  bottom: 20px;
}
    </style>
  </head>
  <body>
    <pre id="out" class="out">3.1</pre>
    <div class="log" id="log">
      <div class="log1" id="log1">---</div>
      <div class="log2" id="log2">---</div>
      <div class="log3" id="log3">---</div>
      <div class="log255" id="log255" onclick="chamge1()">Auto Scroll OFF</div>
    </div>
    <div id="reloadBtn" class="floating-btn" onclick="reload()">↻</div>
    <div id="logoutBtn" class="floating-btn" onclick="backPage()">⇦</div>
    <script>
const out = document.getElementById("out");// 表示場所
const BASE = 100000;    // 1ブロック = 5桁
const arr = [];         // 内部でπの級数を保持する配列
let carry = 0;          // 繰り上がり
let index = 0;          // 現在どこまで計算したか
let auto_scroll = 0;// 自動スクロール用パラメータ
let counter1 = 1;       // 桁数の合計用
let counter2 = 0;       // 計算速度記録用
let counter3 = 0;       // 計算速度比較用

// πの次の5桁を計算する関数
function generatePiBlock(){
  let sum = 0;

  // ===== Step1: 級数を拡張 =====
  // πの級数を17項分まとめて更新する
  for(let j = index + 17; j > index; j--){
    sum = (20 * BASE + sum) * j;
    arr[j] = sum % (2*j + 1);
    sum = Math.floor(sum / (2*j + 1));
  }

  // ===== Step2: 余りを伝播させる =====
  for(let j = index; j > 0; j -= 17){
    arr[j] += sum * j;
    sum = 0;
    for(let k = j; k > j - 17; k--){
      const denom = 2*k + 1;
      // 商の部分
      const q =
        Math.floor(arr[k] / denom) * BASE +
        Math.floor(sum / denom) * k;
      sum = (sum % denom) * k + (arr[k] % denom) * BASE; // 余りの部分
      arr[k] = sum % denom;
      sum = q + Math.floor(sum / denom);
    }
  }

  // ===== Step3: πの次の5桁を確定 =====
  carry = carry * BASE + sum;
  const block = ("00000" + carry).slice(-10, -5);
  carry %= BASE * 10;
  index += 17;
  // 表示
  if(index > 17){             // ← 最初のゴミを捨てる
    out.textContent += block;
    counter1 += 5;
    counter2 += 5;
  }
  if(index % (17 * 10) === 0){
    out.textContent += "\n"; // 見やすく改行
    if(auto_scroll){
      scrollToBottom();
    }
  }
  document.getElementById("log1").innerHTML = "現在: " + counter1 + "桁";
  setTimeout(generatePiBlock, 0); // 次のブロックへ
}
generatePiBlock();// スタート

let timer1 = null;
function event1(){
  document.getElementById("log2").innerHTML = "計算速度: " + counter2 + "桁/秒";
  if((counter2 - counter3) > 0){
    document.getElementById("log3").innerHTML = "前回比較: +" + (counter2 - counter3) + "桁";
  }else if((counter2 - counter3) == 0){
    document.getElementById("log3").innerHTML = "前回比較: ±0桁";
  }else{
    document.getElementById("log3").innerHTML = "前回比較: " + (counter2 - counter3) + "桁";
  }
  counter3 = counter2;
  counter2 = 0;
}timer1 = setInterval(event1,1000);

function chamge1(){
  auto_scroll = 1 - auto_scroll;
  if(auto_scroll){
    document.getElementById("log255").innerHTML = "Auto Scroll ON";
  }else{
    document.getElementById("log255").innerHTML = "Auto Scroll OFF";
  }
}

/* ======== 自動スクロール ======== */
function scrollToBottom(){
  window.scrollTo(0, document.body.scrollHeight); // アニメーションなしで瞬間移動
}

    </script>
    <script>
        const urlParams = new URLSearchParams(location.search);
        const token1 = urlParams.get("key1");
        const token3 = localStorage.getItem("account1");
        localStorage.setItem("account1", "");
        if((token1 !== localStorage.getItem("key1")) || (token3 == "") || (token3 == null)){
            localStorage.setItem("key1", "unauthorized");
            localStorage.setItem("requestPage1", "PI");
            location.href = "/game-sites/";
        }else{
            localStorage.setItem("requestPage1", "");
            localStorage.setItem("key1", "");
            setInterval(() => {
                sendToGAS(token3, "", "tool");
            }, 5000);
        }

    /* ======== Google Apps Script Web App URL ======== */
    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbxzPIpMXRgQ5QuKM_hwIQ815at4Ml6Vvqhx_zabeDNGupPwsTvWWP3jpOXLnxbeGSIMDQ/exec";
    /* ======== GASに送信する処理 ======== */
    async function sendToGAS(User, text, status){
      const payload = {
        user: User,
        message: text,
        status
      };
      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",   // ← GAS が CORS 許可してないため必要
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("送信エラー:", e);
      }
    }

        function reload(){
            const key1 = crypto.randomUUID();
            localStorage.setItem("key1", key1);
            localStorage.setItem("account1", token3);
            location.href = "/game-sites/PI?key1=" + key1;
        }
        function backPage(){
            const key1 = crypto.randomUUID();
            localStorage.setItem("key1", key1);
            localStorage.setItem("account1", token3);
            location.href = "/game-sites/top/top0001/top0001?key1=" + key1;
        }
    </script>
  </body>
