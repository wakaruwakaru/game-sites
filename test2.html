<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>画像アップロード</title>
<style>
body{
  background:#111;
  color:white;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.upload-box{
  background:#1e1e1e;
  padding:30px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 0 20px #000;
}

button{
  margin-top:15px;
  padding:8px 16px;
  background:#4da6ff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#3399ff;
}

#status{
  margin-top:15px;
  font-size:14px;
  color:#aaa;
}

</style>
</head>
<body>

<div class="upload-box">
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="uploadImage()">アップロード</button>
  <div id="status"></div>
</div>
<div id="previewArea"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbypSWf6ZjVWRxhJblPlHUHFr1aD8rOiBp_v8dW3tlHEaCdDSBREzYTHxGmixvDqDxDw/exec";

async function uploadImage(){

  const file = document.getElementById("imageInput").files[0];
  if(!file){
    alert("画像を選択してください");
    return;
  }

  if(file.size > 3 * 1024 * 1024){
    alert("3MB以下にしてください");
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(){

    const base64 = reader.result.split(",")[1];

    document.getElementById("status").textContent = "送信中...";

    const formData = new FormData();

    // 🔥 生成ID
    const id = Date.now() + "_" + Math.floor(Math.random()*10000);

    formData.append("name", id);
    formData.append("mime", file.type);
    formData.append("image", base64);
    formData.append("secret", "testKey");

const res = await fetch(GAS_URL + "?t=" + Date.now(), {
  method: "POST",
  body: formData
});

// 🔥 通信成功チェック
if (!res.ok) {
  document.getElementById("status").textContent =
    "送信失敗 (HTTP " + res.status + ")";
  return;
}

// 🔥 JSON取得
const result = await res.json();

if (!result || result.status !== "ok") {
  document.getElementById("status").textContent = "保存エラー";
  return;
}

// 🔥 DriveIDを使う
const imageID = result.fileId;

console.log("DriveID:", imageID);

document.getElementById("status").textContent =
  "保存完了！ ID: " + imageID;


// 🔥 DriveIDで画像表示
const imgUrl = GAS_URL + "?id=" + imageID + "&secret=testKey";

const imgTag = `
  <div style="margin-top:10px;">
    <p>DriveID: ${imageID}</p>
    <img src="${imgUrl}" style="max-width:200px; border:1px solid #ccc;">
  </div>
`;

document.getElementById("previewArea").innerHTML += imgTag;

  };

  reader.readAsDataURL(file);
}

</script>

</body>
</html>
